<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#1b7a43"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fondo institucional redondeado -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Estructura de Edificios / Condominio -->
  <g filter="url(#drop)">
    <!-- Torre Secundaria (Izquierda) -->
    <rect x="24" y="46" width="30" height="58" rx="3" fill="#ffffff" fill-opacity="0.88"/>
    <rect x="30" y="54" width="6" height="6" rx="1" fill="#1b7a43"/>
    <rect x="42" y="54" width="6" height="6" rx="1" fill="#1b7a43"/>
    <rect x="30" y="66" width="6" height="6" rx="1" fill="#1b7a43"/>
    <rect x="42" y="66" width="6" height="6" rx="1" fill="#1b7a43"/>
    <rect x="30" y="78" width="6" height="6" rx="1" fill="#1b7a43"/>
    <rect x="42" y="78" width="6" height="6" rx="1" fill="#1b7a43"/>

    <!-- Torre Principal (Derecha) -->
    <rect x="50" y="24" width="54" height="80" rx="4" fill="#ffffff"/>
    
    <!-- Remate superior con acento dorado institucional -->
    <rect x="50" y="24" width="54" height="6" rx="2" fill="#facc15"/>

    <!-- Ventanas Torre Principal -->
    <rect x="60" y="38" width="8" height="8" rx="1.5" fill="#27ae60"/>
    <rect x="74" y="38" width="8" height="8" rx="1.5" fill="#27ae60"/>
    <rect x="88" y="38" width="8" height="8" rx="1.5" fill="#27ae60"/>

    <rect x="60" y="52" width="8" height="8" rx="1.5" fill="#27ae60"/>
    <rect x="74" y="52" width="8" height="8" rx="1.5" fill="#facc15"/>
    <rect x="88" y="52" width="8" height="8" rx="1.5" fill="#27ae60"/>

    <rect x="60" y="66" width="8" height="8" rx="1.5" fill="#27ae60"/>
    <rect x="74" y="66" width="8" height="8" rx="1.5" fill="#27ae60"/>
    <rect x="88" y="66" width="8" height="8" rx="1.5" fill="#27ae60"/>

    <!-- Puerta de acceso -->
    <rect x="71" y="88" width="12" height="16" rx="1.5" fill="#1b7a43"/>
  </g>
</svg>
