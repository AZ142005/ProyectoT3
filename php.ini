; Freebuff Desktop - PHP Configuration
; Copy to C:\php\php.ini or set via: php -c php.ini

[PHP]
extension=pdo_mysql
extension=mbstring
extension=openssl
extension=curl
extension=fileinfo
; session and json are built-in to PHP 8.5
; extension=session
; extension=json

; Error reporting for development
display_errors = On
error_reporting = E_ALL
log_errors = On

; Session settings
session.cookie_httponly = 1
session.cookie_samesite = Strict

; Upload limits
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 30
